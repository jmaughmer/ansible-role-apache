---
# PHP on EL8 and EL9 comes from AppStream module streams.
- name: Select the PHP module stream
  when:
    - apache_php_enabled | bool
    - __apache_php_stream | length > 0
  block:
    - name: List the enabled PHP module stream
      ansible.builtin.command: dnf -q module list --enabled php
      register: __apache_php_module_list
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the enabled stream
      ansible.builtin.set_fact:
        __apache_php_enabled_stream: >-
          {{ __apache_php_module_list.stdout | default('')
             | regex_findall('(?m)^php\s+(\S+)\s+\[e\]') | first | default('') }}

    - name: Switch the PHP module stream
      ansible.builtin.command: "dnf -y module {{ 'enable' if __apache_php_enabled_stream == '' else 'switch-to' }} php:{{ __apache_php_stream }}"
      when: __apache_php_enabled_stream != __apache_php_stream
      changed_when: true

- name: Install Apache packages
  ansible.builtin.dnf:
    name: >-
      {{ apache_packages + apache_extra_packages + __apache_tls_packages
         + ((__apache_php_base_packages + apache_php_packages) if apache_php_enabled | bool else []) }}
    state: present
