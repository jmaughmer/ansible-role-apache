---
- name: Create the TLS directory
  ansible.builtin.file:
    path: "{{ apache_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Look for an existing Let's Encrypt certificate
  ansible.builtin.stat:
    path: "{{ __apache_letsencrypt_live_dir }}/fullchain.pem"
    get_checksum: false
  register: __apache_letsencrypt_cert
  when: apache_tls_source == 'letsencrypt'

# Let's Encrypt: httpd needs a certificate to start, and must be running to get
# one, so the first run starts on a self-signed certificate. letsencrypt.yml
# swaps it for the real one once httpd is up.
- name: Create the self-signed certificates
  ansible.builtin.import_tasks: tls_selfsigned.yml
  when: >-
    apache_tls_source == 'selfsigned' or
    (apache_tls_source == 'letsencrypt' and not __apache_letsencrypt_cert.stat.exists)

- name: Install the supplied certificates
  ansible.builtin.import_tasks: tls_provided.yml
  when: apache_tls_source == 'provided'

- name: Create the ACME challenge directory
  ansible.builtin.file:
    path: "{{ apache_letsencrypt_webroot }}/.well-known/acme-challenge"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: apache_tls_source == 'letsencrypt'
