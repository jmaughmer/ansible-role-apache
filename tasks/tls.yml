---
- name: Create the TLS directory
  ansible.builtin.file:
    path: "{{ apache_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# ---------------------------------------------------------------------------
# Supplied certificate
# ---------------------------------------------------------------------------
- name: Install the supplied certificate files
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content if item.content | length > 0 else omit }}"
    src: "{{ item.src if item.content | length == 0 else omit }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { dest: "{{ apache_tls_cert_path }}", content: "{{ apache_tls_cert_content }}", src: "{{ apache_tls_cert_src }}", group: root, mode: "0644" }
    - { dest: "{{ apache_tls_key_path }}", content: "{{ apache_tls_key_content }}", src: "{{ apache_tls_key_src }}", group: root, mode: "0600" }
    - { dest: "{{ apache_tls_ca_path }}", content: "{{ apache_tls_ca_content }}", src: "{{ apache_tls_ca_src }}", group: root, mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"
  when:
    - apache_tls_source == 'provided'
    - item.content | length > 0 or item.src | length > 0
  no_log: "{{ item.dest == apache_tls_key_path }}"
  notify: Restart httpd

# ---------------------------------------------------------------------------
# Self-signed: a private CA for this server, and a server certificate it signs.
# Browsers and clients trust ca.crt.
# ---------------------------------------------------------------------------
- name: Create the self-signed certificates
  when: apache_tls_source == 'selfsigned'
  block:
    - name: Create the CA private key
      community.crypto.openssl_privatekey:
        path: "{{ apache_tls_dir }}/ca.key"
        type: "{{ apache_tls_selfsigned_key_type }}"
        size: "{{ apache_tls_selfsigned_key_size }}"
        owner: root
        group: root
        mode: "0600"

    - name: Create the CA signing request
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ apache_tls_dir }}/ca.key"
        common_name: "Apache CA {{ apache_tls_selfsigned_common_name }}"
        use_common_name_for_san: false
        basic_constraints: ["CA:TRUE", "pathlen:0"]
        basic_constraints_critical: true
        key_usage: [keyCertSign, cRLSign]
        key_usage_critical: true
        digest: "{{ apache_tls_selfsigned_digest }}"
      register: __apache_ca_csr
      changed_when: false

    - name: Create the CA certificate
      community.crypto.x509_certificate:
        path: "{{ apache_tls_ca_path }}"
        csr_content: "{{ __apache_ca_csr.csr }}"
        privatekey_path: "{{ apache_tls_dir }}/ca.key"
        provider: selfsigned
        selfsigned_digest: "{{ apache_tls_selfsigned_digest }}"
        selfsigned_not_after: "+{{ apache_tls_selfsigned_ca_days }}d"
        owner: root
        group: root
        mode: "0644"
      notify: Restart httpd

    - name: Create the server private key
      community.crypto.openssl_privatekey:
        path: "{{ apache_tls_key_path }}"
        type: "{{ apache_tls_selfsigned_key_type }}"
        size: "{{ apache_tls_selfsigned_key_size }}"
        owner: root
        group: root
        mode: "0600"
      notify: Restart httpd

    - name: Create the server signing request
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ apache_tls_key_path }}"
        common_name: "{{ apache_tls_selfsigned_common_name }}"
        subject_alt_name: "{{ apache_tls_selfsigned_subject_alt_names }}"
        key_usage: [digitalSignature, keyEncipherment]
        key_usage_critical: true
        extended_key_usage: [serverAuth]
        digest: "{{ apache_tls_selfsigned_digest }}"
      register: __apache_server_csr
      changed_when: false

    - name: Check the server certificate expiry
      community.crypto.x509_certificate_info:
        path: "{{ apache_tls_cert_path }}"
        valid_at:
          renew: "+{{ apache_tls_selfsigned_renew_days }}d"
      register: __apache_cert_info
      failed_when: false

    - name: Issue the server certificate
      community.crypto.x509_certificate:
        path: "{{ apache_tls_cert_path }}"
        csr_content: "{{ __apache_server_csr.csr }}"
        provider: ownca
        ownca_path: "{{ apache_tls_ca_path }}"
        ownca_privatekey_path: "{{ apache_tls_dir }}/ca.key"
        ownca_digest: "{{ apache_tls_selfsigned_digest }}"
        ownca_not_after: "+{{ apache_tls_selfsigned_days }}d"
        force: "{{ not (__apache_cert_info.valid_at.renew | default(true)) }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart httpd
