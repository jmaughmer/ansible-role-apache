---
# Other roles in the same play (phpMyAdmin, phpIPAM...) can notify these by
# their listen names after dropping files into /etc/httpd/conf.d.
- name: Restart httpd
  ansible.builtin.systemd_service:
    name: httpd
    state: restarted
  when: apache_service_state == 'started'
  listen: restart httpd

- name: Reload httpd
  ansible.builtin.systemd_service:
    name: httpd
    state: reloaded
  when: apache_service_state == 'started'
  listen: reload httpd

- name: Restart php-fpm
  ansible.builtin.systemd_service:
    name: php-fpm
    state: restarted
  when:
    - apache_php_enabled | bool
    - apache_service_state == 'started'
  listen: restart php-fpm

- name: Update fapolicyd trust
  ansible.builtin.shell: |
    set -o pipefail
    # fapolicyd reads trust.d on start, so there is nothing to update while it
    # is not running (fapolicyd-cli would only error). A failure while it runs
    # is real — stale hashes, malformed trust file — and must fail the run
    # here, not surface later as unexplained 403s from php-fpm.
    if systemctl is-active --quiet fapolicyd; then
      fapolicyd-cli --update
    fi
  args:
    executable: /bin/bash
  changed_when: true

- name: Warn about crypto policy reboot
  ansible.builtin.debug:
    msg: The system crypto policy changed. Reboot so every process picks it up.
