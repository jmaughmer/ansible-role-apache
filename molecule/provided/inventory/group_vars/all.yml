# Baselines the verify run restores between the rejection cases, so each case
# fails only for its own reason.
molecule_ssl_valid:
  - name: www.example.test
    certificate:
      content: "{{ molecule_cert_www }}"
    key:
      content: "{{ molecule_key_www }}"
  - name: app.example.test
    certificate:
      content: "{{ molecule_cert_app }}"
    key:
      content: "{{ molecule_key_app }}"
molecule_vhosts_valid:
  - server_name: app.example.test
    document_root: /srv/app
    ssl_certificate: app.example.test

# ---------------------------------------------------------------------------
# Role inputs
# ---------------------------------------------------------------------------
apache_tls_source: provided
apache_server_name: www.example.test
# www.example.test matches the first ssl_certificates entry, so the default
# vhost gets it through the apache_tls_*_path symlinks. app.example.test is a
# named vhost picking its certificate by ssl_certificate name.
apache_vhosts: "{{ molecule_vhosts_valid }}"
ssl_certificates: "{{ molecule_ssl_valid }}"
# Covers the knob's false path; verify asserts the served header omits it.
apache_hsts_include_subdomains: false
