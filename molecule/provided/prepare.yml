---
# Runs once, after the VMs are created. Play 1 is the same lab bring-up the
# default scenario uses (see its prepare.yml for why each step is there); play
# 2 lays out the static page the verify run fetches. Privilege comes from the
# scenario's group_vars (ansible_become), because the driver's SSH lands as a
# sudo user.
- name: Get the VMs ready for ansible-core
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH to be up after first boot
      ansible.builtin.wait_for_connection:

    # The AlmaLinux cloud templates were first booted on the LAN, so they can
    # carry a stale /etc/resolv.conf that EL9's cloud images never update
    # (NM dns=none; cloud-init owns the file). Rewrite it from the lease.
    - name: Point resolv.conf at the labnet DNS from DHCP
      ansible.builtin.raw: |
        gw=$(ip -4 route | awk '/default via/ {print $3; exit}')
        test -n "$gw"
        dns=""
        for d in $(nmcli -t -f IP4.DNS device show eth0 | cut -d: -f2); do
          [ "$d" = "$gw" ] && dns=$d
        done
        printf 'nameserver %s\n' "${dns:-$gw}" > /etc/resolv.conf
      changed_when: true

    # Current ansible-core refuses a target whose only Python is 3.6 (RHEL 8);
    # raw needs no Python on the target, so install 3.11 before play 2 runs.
    - name: Install Python 3.11 on EL8 hosts
      ansible.builtin.raw: >-
        /bin/sh -c "if grep -q ' release 8' /etc/redhat-release
        && ! rpm -q --quiet python3.11;
        then dnf -y -q install python3.11 && echo installed; fi"
      register: el8_python
      changed_when: "'installed' in el8_python.stdout"

    # Labnet DNS can hiccup while several VMs boot at once, which used to
    # kill a first dnf call (Curl error 6). Prime name and metadata here with
    # bounded retries; the dnf below then finds fresh metadata.
    - name: Prime DNS and dnf metadata
      ansible.builtin.raw: >-
        /bin/sh -c "for i in 1 2 3 4 5; do
        if getent hosts mirrors.almalinux.org && dnf -y -q makecache;
        then exit 0; fi; sleep 10; done; exit 1"
      changed_when: false

- name: Prepare
  hosts: all
  tasks:
    # verify.yml compares the certificates httpd serves against the fixtures
    # with the openssl CLI.
    - name: Install the openssl command-line tool
      ansible.builtin.dnf:
        name: openssl
        state: present

    - name: Create the directory for the app vhost page
      ansible.builtin.file:
        path: /srv/app
        state: directory
        mode: "0755"

    # No trailing newline: verify.yml compares curl's stdout against 'app-ok'.
    - name: Write the page the verify run fetches
      ansible.builtin.copy:
        dest: /srv/app/index.html
        content: app-ok
        mode: "0644"
