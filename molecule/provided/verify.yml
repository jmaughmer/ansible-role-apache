---
- name: Verify
  hosts: all
  vars_files:
    - vars/main.yml
    - vars/vault.yml
  vars:
    tls_dir: /etc/pki/httpd
    fqdn_crt: "{{ tls_dir }}/{{ ansible_fqdn }}.crt"
    app_crt: "{{ tls_dir }}/app.example.test.crt"
    app_key: "{{ tls_dir }}/app.example.test.key"
    shared_crt: "{{ tls_dir }}/shared.example.test.crt"
    shared_key: "{{ tls_dir }}/shared.example.test.key"
    supplied_files: "{{ [fqdn_crt, fqdn_crt | regex_replace('crt$', 'key'), app_crt, app_key, shared_crt, shared_key] }}"
  tasks:
    # ---------------------------------------------------------------------------
    # What converge left behind
    # ---------------------------------------------------------------------------
    - name: Read the supplied files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ supplied_files }}"
      register: installed

    - name: Assert certificates are 0644 and keys 0600, owned by root
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - item.stat.mode == ('0600' if item.stat.path.endswith('.key') else '0644')
        fail_msg: "{{ item.stat.path }} has mode {{ item.stat.mode | default('none') }}"
        quiet: true
      loop: "{{ installed.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the default certificate paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: ["{{ tls_dir }}/server.crt", "{{ tls_dir }}/server.key"]
      register: default_links

    - name: Assert they link to the entry named after apache_server_name
      ansible.builtin.assert:
        that:
          - default_links.results[0].stat.islnk
          - default_links.results[0].stat.lnk_source == fqdn_crt
          - default_links.results[1].stat.islnk
          - default_links.results[1].stat.lnk_source == fqdn_crt | regex_replace('crt$', 'key')
        quiet: true

    - name: Check each name is served the right certificate
      ansible.builtin.include_tasks: tasks/served_cert.yml
      vars:
        sni: "{{ served.sni }}"
        file: "{{ served.file }}"
      loop:
        - { sni: "{{ ansible_fqdn }}", file: "{{ fqdn_crt }}" }
        - { sni: nobody.example.test, file: "{{ fqdn_crt }}" }
        - { sni: plain.example.test, file: "{{ fqdn_crt }}" }
        - { sni: app.example.test, file: "{{ app_crt }}" }
        - { sni: other.example.test, file: "{{ shared_crt }}" }
        - { sni: path.example.test, file: "{{ shared_crt }}" }
      loop_control:
        loop_var: served

    - name: Count the certificates sent, chain included
      ansible.builtin.shell: |
        set -o pipefail
        openssl s_client -connect 127.0.0.1:443 -servername {{ ansible_fqdn | quote }} -showcerts </dev/null 2>/dev/null |
          grep -c 'BEGIN CERTIFICATE'
      args:
        executable: /bin/bash
      register: chain
      changed_when: false
      failed_when: chain.stdout | trim != '2'

    # ---------------------------------------------------------------------------
    # Configurations the role must refuse
    # ---------------------------------------------------------------------------
    - name: Read a certificate and an unrelated key  # noqa: run-once[task]
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ app_crt }}"
        - "{{ app_key }}"
        - "{{ shared_key }}"
      register: pem
      no_log: true

    - name: Make a passphrase-protected copy of a key
      ansible.builtin.command: openssl pkey -in {{ app_key | quote }} -aes256 -passout pass:molecule
      register: locked_key
      changed_when: false
      no_log: true

    - name: Make an expired certificate for a key
      when: true
      block:
        - name: Create a signing request
          community.crypto.openssl_csr_pipe:
            privatekey_path: "{{ app_key }}"
            common_name: app.example.test
          register: expired_csr
          changed_when: false

        - name: Sign it with dates in the past
          community.crypto.x509_certificate_pipe:
            csr_content: "{{ expired_csr.csr }}"
            provider: selfsigned
            privatekey_path: "{{ app_key }}"
            selfsigned_not_before: "-2d"
            selfsigned_not_after: "-1d"
          register: expired_cert
          changed_when: false

    - name: Fingerprint the installed files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ supplied_files }}"
      register: before_rejects

    - name: Refuse an empty list
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: at least one entry
        apache_vhosts: []
        ssl_certificates: []

    - name: Refuse a name that isn't safe as a file name
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: safe as a file name
        apache_vhosts: []
        ssl_certificates:
          - { name: ../evil, certificate: { content: x }, key: { content: x } }

    - name: Refuse duplicate names
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: unique name
        apache_vhosts: []
        ssl_certificates:
          - { name: twice, certificate: { content: x }, key: { content: x } }
          - { name: twice, certificate: { content: x }, key: { content: x } }

    - name: Refuse an entry with no key
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: key.content
        apache_vhosts: []
        ssl_certificates:
          - { name: nokey, certificate: { content: x } }

    - name: Refuse a default certificate that isn't listed
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: apache_tls_default_certificate must be
        apache_vhosts: []
        apache_tls_default_certificate: missing

    - name: Refuse a virtual host that asks for an unlisted certificate
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: must name an entry
        apache_vhosts:
          - { server_name: lost.example.test, ssl_certificate: missing }

    - name: Refuse a virtual host certificate with another source
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: needs apache_tls_source
        apache_tls_source: selfsigned

    - name: Refuse an unknown source
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: apache_tls_source must be
        apache_tls_source: acme

    - name: Refuse a certificate that isn't PEM
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: the certificate is not valid PEM
        apache_vhosts: []
        ssl_certificates:
          - name: app.example.test
            certificate: { content: not a certificate }
            key: { content: "{{ pem.results[1].content | b64decode }}" }

    - name: Refuse a key that isn't PEM
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: the key is not valid PEM
        apache_vhosts: []
        ssl_certificates:
          - name: app.example.test
            certificate: { content: "{{ pem.results[0].content | b64decode }}" }
            key: { content: not a key }

    - name: Refuse a key with a passphrase
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: has a passphrase
        apache_vhosts: []
        ssl_certificates:
          - name: app.example.test
            certificate: { content: "{{ pem.results[0].content | b64decode }}" }
            key: { content: "{{ locked_key.stdout }}" }

    - name: Refuse a key from another certificate
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: does not match
        apache_vhosts: []
        ssl_certificates:
          - name: app.example.test
            certificate: { content: "{{ pem.results[0].content | b64decode }}" }
            key: { content: "{{ pem.results[2].content | b64decode }}" }

    - name: Refuse an expired certificate
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        expected: has expired
        apache_vhosts: []
        ssl_certificates:
          - name: app.example.test
            certificate: { content: "{{ expired_cert.certificate }}" }
            key: { content: "{{ pem.results[1].content | b64decode }}" }

    - name: Fingerprint the installed files again
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ supplied_files }}"
      register: after_rejects

    - name: Assert the refused pairs changed no files
      ansible.builtin.assert:
        that: after_rejects.results | map(attribute='stat.checksum') | list == before_rejects.results | map(attribute='stat.checksum') | list
        quiet: true

    - name: Assert nothing was written for the refused names
      ansible.builtin.stat:
        path: "{{ tls_dir }}/{{ item }}"
      loop: [nokey.crt, twice.crt, evil.crt]
      register: stray
      failed_when: stray.stat.exists

    # ---------------------------------------------------------------------------
    # Moving between sources
    # ---------------------------------------------------------------------------
    - name: Switch to a self-signed certificate
      ansible.builtin.include_role:
        name: ansible-role-apache
      vars:
        apache_tls_source: selfsigned
        apache_vhosts: []

    - name: Read the certificate paths and supplied files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ [tls_dir ~ '/server.crt', tls_dir ~ '/server.key'] + supplied_files }}"
      register: switched

    - name: Assert the links were replaced and the supplied files left alone
      ansible.builtin.assert:
        that:
          - not switched.results[0].stat.islnk
          - not switched.results[1].stat.islnk
          - switched.results[2:] | map(attribute='stat.checksum') | list == before_rejects.results | map(attribute='stat.checksum') | list
        quiet: true

    - name: Check the self-signed certificate is served
      ansible.builtin.include_tasks: tasks/served_cert.yml
      vars:
        sni: "{{ ansible_fqdn }}"
        file: "{{ tls_dir }}/server.crt"

    - name: Switch back, with another default certificate
      ansible.builtin.include_role:
        name: ansible-role-apache
      vars:
        apache_vhosts: []
        apache_tls_default_certificate: app.example.test

    - name: Read the certificate path
      ansible.builtin.stat:
        path: "{{ tls_dir }}/server.crt"
      register: chosen

    - name: Assert it links to the chosen entry
      ansible.builtin.assert:
        that: chosen.stat.islnk and chosen.stat.lnk_source == app_crt
        quiet: true

    - name: Check the chosen certificate is served by default
      ansible.builtin.include_tasks: tasks/served_cert.yml
      vars:
        sni: nobody.example.test
        file: "{{ app_crt }}"

    - name: Use an entry named after the link itself
      ansible.builtin.include_role:
        name: ansible-role-apache
      vars:
        apache_vhosts: []
        ssl_certificates:
          - name: server
            certificate: { content: "{{ pem.results[0].content | b64decode }}" }
            key: { content: "{{ pem.results[1].content | b64decode }}" }

    - name: Read the certificate paths and supplied files again
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ [tls_dir ~ '/server.crt', tls_dir ~ '/server.key'] + supplied_files }}"
      register: named_server

    - name: Assert the files are real and what the links pointed to is untouched
      ansible.builtin.assert:
        that:
          - not named_server.results[0].stat.islnk
          - not named_server.results[1].stat.islnk
          - named_server.results[1].stat.mode == '0600'
          - named_server.results[2:] | map(attribute='stat.checksum') | list == before_rejects.results | map(attribute='stat.checksum') | list
        quiet: true

    - name: Go back to the converged configuration
      ansible.builtin.include_role:
        name: ansible-role-apache

    - name: Check the original certificates are served
      ansible.builtin.include_tasks: tasks/served_cert.yml
      vars:
        sni: "{{ served.sni }}"
        file: "{{ served.file }}"
      loop:
        - { sni: nobody.example.test, file: "{{ fqdn_crt }}" }
        - { sni: app.example.test, file: "{{ app_crt }}" }
      loop_control:
        loop_var: served
