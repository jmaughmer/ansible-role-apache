---
# Tests run on the Proxmox test lab: two real KVM VMs cloned from the lab
# fleet onto the isolated labnet network — SELinux enforcing and firewalld
# running, the paths containers could never exercise. The pair covers the
# role's EL matrix: EL9 and EL10 side by side. The driver connects as a sudo
# user, so the provisioner's inventory group_vars set ansible_become and
# every task of the repo's own playbooks runs privileged through it.
#
# All Proxmox connection details live in the driver's secrets file on the
# control machine, not here. Default VMIDs are the repo's 9210-9211 band, via
# LAB_VMID_0/1 so the lab's `mlab` runner can claim a free band per run and
# allow parallel runs of this repo; a plain molecule test uses the pinned band,
# one lab run of this repo at a time.
#
# Run on the lab's molecule control machine:
#   /root/labnet/mlab test -s default              # parallel-safe, recommended
#   molecule test                                  # pinned band
#   LAB_TEMPLATE_EL9=template-alma8 molecule test  # exercise the EL8 box too
#
# LAB_TEMPLATE_EL9/LAB_TEMPLATE_EL10 pick each box's fleet template
# (defaults template-alma9 / template-alma10; the role is EL-only).
role_name_check: 1

dependency:
  name: galaxy
  enabled: false        # collections preinstalled on the control machine
prerun: false

driver:
  name: molecule-proxmox
  options:
    proxmox_secrets: ${LAB_PROXMOX_SECRETS:-/root/.config/molecule/proxmox-secrets.yml}
    node: ${LAB_NODE:-galactica}
    validate_certs: true    # galactica serves a valid Let's Encrypt cert (ACME) on its FQDN
    ssh_user: ${LAB_SSH_USER:-labadmin}
    ssh_identity_file: ${LAB_SSH_KEY:-/root/.ssh/id_ed25519}
    full: ${LAB_FULL:-true}
    pool: ${LAB_POOL:-testlab}
    timeout: ${LAB_TIMEOUT:-300}

platforms:
  - name: apache-default-el9
    template_name: ${LAB_TEMPLATE_EL9:-template-alma9}
    newid: ${LAB_VMID_0:-9210}

  - name: apache-default-el10
    template_name: ${LAB_TEMPLATE_EL10:-template-alma10}
    newid: ${LAB_VMID_1:-9211}

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:/root/.ansible/roles"
  inventory:
    group_vars:
      all:
        # The driver's SSH lands as a sudo user (unlike a container's root);
        # make every task of the repo's own playbooks become-root.
        ansible_become: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
